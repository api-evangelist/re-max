summary: >-
  RE/MAX Europe publishes documentation for the STAGING environment of its
  Listings API and nothing for production - the inverse of the usual posture.
  There is a real, separately hosted test environment with its own OAuth
  authorization server, and the published example requests carry real-looking
  test identifiers. Credentials for it are still partner-only; there is no
  self-serve sandbox signup, no test key prefix scheme and no fixture or trigger
  tooling. The Datahub API publishes no test environment at all.
environments:
