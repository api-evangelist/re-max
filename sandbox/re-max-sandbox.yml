  api: RE/MAX Europe Listings API
  documented: true
  docs: https://listingsapi-test.datahub.remax.eu/
  base_url: https://listing-api-remaxeu.bwscloud.tech/api/v1
  auth_server: https://oauth.pre-prod.remaxeu-datahub.bwscloud.tech
  host_note: >-
    the staging API and its authorization server run on a third-party vendor
