format: proprietary
rfc9457: false
note: >-
  RE/MAX Europe publishes no error reference page and no machine-readable spec,
  so this catalog is built from error responses observed live against the
  production Datahub host and the remax.eu WordPress host. It is deliberately
  short: only codes that were actually returned to an anonymous caller are
  recorded. Authenticated-path error codes cannot be enumerated without
  partner credentials.
envelopes:
- api: RE/MAX Europe Datahub API
  host: https://api.datahub.remax.eu
  shape: '{"status":[{"code":<int>,"message":"<string>"}],"result":{}}'
  media_type: application/json
  notes: >-
    Errors are returned in a status[] array alongside an always-present result
    object; there is no type URI, no title/detail split and no problem+json
    media type, so this is not RFC 9457. The numeric code is a RE/MAX-internal
    4xxx series that does not track the HTTP status (4007 is served with 400,
    4004 with 403).
- api: RE/MAX Europe Site API (WordPress REST)
  host: https://www.remax.eu
  shape: '{"code":"<slug>","message":"<string>","data":{"status":<int>}}'
  media_type: application/json
  notes: standard WordPress REST API error envelope, not a RE/MAX design
