probes:
  usCorporateAndPortalSearch:
    - url: https://www.remax.com/
      status: 200
      note: >-
        Live consumer portal on CloudFront. Repeat requests later in the session
        returned HTTP 202 with a zero-byte body and header
        "x-amzn-waf-action: challenge" — the site is behind AWS WAF and
        rate-limits automated clients. WebFetch received 403.
    - url: https://remax.com/
      status: 200
    - url: https://www.remax.com/robots.txt
      status: 200
      note: >-
        Disallows /api/, /v2/, /feature-flags/ for all agents; lists 15 sitemap
        index files (forsale, forrent, agents, offices, neighborhoods, land,
        condo, mobile-homes, townhome, open-house, etc).
    - url: https://www.remax.com/developers
      status: 404
      note: Real 404 on first probe; later 202 WAF challenge.
    - url: https://www.remax.com/api-docs
      status: 404
      note: Real 404 HTML page, 51,469 bytes.
    - url: https://www.remax.com/api
      status: 200
      note: Empty body; robots-disallowed internal path, not a documented API.
    - url: https://www.remax.com/docs
      status: 202
      note: AWS WAF challenge, zero-byte body. Inconclusive but no spec served.
    - url: https://www.remax.com/openapi.json
      status: 202
      note: AWS WAF challenge, zero-byte body. No OpenAPI document served.
    - url: https://www.remax.com/swagger.json
      status: 202
      note: AWS WAF challenge, zero-byte body. No Swagger document served.
    - url: https://www.remax.com/$metadata
      status: 202
      note: AWS WAF challenge, zero-byte body. No OData metadata document served.
    - url: https://www.remax.com/.well-known/openid-configuration
      status: 202
      note: AWS WAF challenge, zero-byte body.
    - url: https://www.remax.com/.well-known/security.txt
      status: 404
    - url: https://www.remax.com/llms.txt
      status: 404
    - url: https://www.remax.com/feeds
      status: 404
    - url: https://www.remax.com/data
      status: 404
    - url: https://www.remax.com/sitemap.xml
      status: 403
    - url: https://investors.remaxholdings.com/
      status: 403
      note: >-
        Real host, Cloudflare bot challenge (cf-mitigated: challenge). Not
        fetchable anonymously.
    - url: https://news.remax.com/
      status: 200
      note: RE/MAX corporate newsroom. Live, fetchable.
    - url: https://global.remax.com/
      status: 200
      note: Serves a "Security Check / Verifying your connection" interstitial.

  usSubdomainProbes:
    finding: >-
      CRITICAL — remax.com serves a DNS WILDCARD. The control probe
      zzzznotreal.remax.com resolves to exactly the same target as
      developer.remax.com, developers.remax.com and docs.remax.com
      (CNAME customers.kvcore.com, behind Cloudflare). Those three hostnames are
      therefore NOT developer portals; they are wildcard artifacts pointing at
      the kvCORE agent-website platform (Inside Real Estate), which RE/MAX
      adopted as "MAX/Tech powered by kvCORE". A 403 here is a Cloudflare
      challenge for a site that does not exist, not a gated portal.
    hosts:
    - url: https://developer.remax.com/
      status: 403
      dns: CNAME customers.kvcore.com
      verdict: wildcard, not a portal
    - url: https://developers.remax.com/
      status: 403
      dns: CNAME customers.kvcore.com
      verdict: wildcard, not a portal
    - url: https://docs.remax.com/
      status: 403
      dns: CNAME customers.kvcore.com
      verdict: wildcard, not a portal
    - url: https://zzzznotreal.remax.com/
      status: n/a
      dns: CNAME customers.kvcore.com
      verdict: CONTROL PROBE — proves the wildcard
    - url: https://api.remax.com/
      status: 000
      dns: >-
        CNAME api.remax-prod.booj.io — which returns NXDOMAIN. This is a DANGLING
        CNAME. booj was the in-house RE/MAX technology platform (acquired 2018,
        products sunset around mid-2023 when RE/MAX moved to kvCORE); the DNS
        record outlived the service. api.remax.com does not resolve and cannot be
        called.
      verdict: dangling CNAME to a decommissioned host

  euDeveloperSurface:
    finding: >-
      remax.eu has NO wildcard (zzzznotreal.remax.eu and
      zzzznotreal.datahub.remax.eu both fail to resolve), so every hostname below
      is a deliberately created record. These are real, intentional, publicly
