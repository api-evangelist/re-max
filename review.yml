# =====================================================================
harvest:
  openapi:
    harvested: false
    count: 0
    note: >-
      No OpenAPI, Swagger, AsyncAPI, GraphQL schema or OData $metadata document
      exists anywhere in the RE/MAX estate. Every candidate path was probed and
      returned 404 or a WAF challenge with a zero-byte body. The openapi/
      directory is deliberately absent rather than empty.
  collections:
    harvested: true
    count: 2
    format: Postman Collection v2.0
    items:
      - path: collections/re-max-eu-datahub-api.postman_collection.json
        name: API docs (RE/MAX EU Datahub)
        sourceURL: >-
          https://apidocs.datahub.remax.eu/api/collections/29687718/2s9YJdWNK2?environment=29687718-29bf463b-74bd-4a30-94b6-cc1cf9a4a740&segregateAuth=true&versionTag=latest
        httpStatus: 200
        fetched: '2026-07-26'
        bytes: 103047
        publishDate: '2023-10-05T13:50:26.000Z'
        public: true
        parsed: true
        operations: 52
        folders:
          - Reporting - GCI, Transactions and Volume
          - Office
          - Person
          - RE/MAX Title
          - User
          - Miscellaneous
          - Teams
        baseHost: api.datahub.remax.eu/external
        auth: >-
          oauth2, authUrl https://oauth.datahub.remax.eu/authorize, accessTokenUrl
          https://oauth.datahub.remax.eu/token, clientId placeholder "Ask_REU"
        redactions: none required
      - path: collections/re-max-eu-listings-api.postman_collection.json
        name: RE/MAX EU - Listings API - Staging
        sourceURL: >-
          https://listingsapi-test.datahub.remax.eu/api/collections/29687718/2sA3drJF17?environment=29687718-4b1bd698-a858-4d33-b338-6a38f1eb61a8&segregateAuth=true&versionTag=latest
        httpStatus: 200
        fetched: '2026-07-26'
        bytes: 95170
        publishDate: '2026-05-21T08:20:53.000Z'
        public: true
        parsed: true
        operations: 35
        baseHost: listing-api-remaxeu.bwscloud.tech/api/v1
        auth: >-
          oauth2 against oauth.pre-prod.remaxeu-datahub.bwscloud.tech, token
          passed as an access_token query parameter
        redactions: >-
          SECURITY — the published collection embedded a live-looking 128-character
          hexadecimal staging access_token in 4 request URLs. All 4 occurrences
          were replaced with "REDACTED-BY-API-EVANGELIST" before the file was
          saved to this repo. The document still parses as valid JSON. Reported
          here rather than reproduced. RE/MAX Europe should rotate it.

apiFamily:
  segmentationAsTheDocsUseIt:
    - segment: Franchise operations (offices, persons, RE/MAX Titles, teams, regions)
      surface: RE/MAX Europe Datahub API
      note: >-
        The dominant surface. This is a franchise-network membership and
        role-management API, not a property API. It includes
        /external/personBySSN/:SSNnumber — person lookup by social security
        number — which is a notable amount of PII reach for a partner API.
    - segment: Financial reporting (GCI, transactions, volume)
      surface: RE/MAX Europe Datahub API — /external/reporting/...
      note: Monthly per-office and per-person commission and volume reporting.
    - segment: Listings and listing media
      surface: RE/MAX Europe Listings API (staging only)
      note: >-
        Full CRUD over listings plus image add/replace/describe/delete, listing
        entry logs, and lookups for regions, offices, agents, listing countries
        and cities by country. Proprietary schema; NOT RESO Data Dictionary.
    - segment: Property records / valuation / AVM / title / escrow / transactions / documents / tenancy / payments
      surface: none
      note: >-
        RE/MAX publishes no API in any of these categories. Motto Mortgage and
        wemlo (its US mortgage brands) publish no developer surface either.
  webhooks: none documented
  events: none documented
  asyncapi: none
  graphql: none
  sdks: none published
  cli: none published
  postman: >-
    Yes — two custom-domain Postman Documenter sites are the entire developer
    experience. There is no Run-in-Postman public workspace.
  changelog: none published
  status page: none found
  ratePlans: none published
  rateLimits: none documented

conclusions:
  developerPortal: https://apidocs.datahub.remax.eu/
  portalConfirmed: true
  portalCaveat: >-
    Confirmed live at 200 and freely readable without login — but it belongs to
    RE/MAX Europe, not the United States home market, and it grants no
    credentials. It is documentation without onboarding.
  gated: true
  accessGate: partner-only
  openData: false
  resoCertified: false
  resoPosture: >-
    RESO Class D member with a board seat; NOT in the RESO certification
    directory; no Web API or Data Dictionary endorsement; no $metadata, no
    OData, no UPI in any published artifact.
  sectorLesson: >-
    RE/MAX is the clean counter-example to the assumption that RESO membership
    implies a reachable contract. It sits on the standards board that governs the
    only mandated machine-readable contract in real estate, and ships none of it.
    Its US surface is a WAF-protected consumer portal with a dangling api.
    subdomain and a wildcard that makes three non-existent developer hostnames
    answer on port 443. Its one real API programme lives in Europe, is
    proprietary rather than RESO-shaped, documents only its staging environment,
    and hands out credentials by asking.

# =====================================================================
# ROUND 2 ADDENDUM — enrichment pass, 2026-07-26
# New probes run after the first review; these findings AMEND it.
# =====================================================================
round2:
  date: '2026-07-26'
  method: enrichment pipeline (search / generate / derive) with fresh live probes
  amendments:
  - finding: >-
      RE/MAX Europe DOES publish a machine-readable, anonymously readable
      discovery document — just not on a developer host and not in a developer
      format. https://www.remax.eu/wp-json/ returns 200 with the WordPress REST
      API route descriptor: 42 namespaces, 791 routes, each with methods and
      argument definitions. Anonymous reads of /wp-json/wp/v2/posts and
      /wp-json/wp/v2/regions both returned 200. Saved verbatim to
      well-known/re-max-eu-wp-json.json. The first round's "no machine-readable
      contract of any kind" holds for the API programme, but not for the estate.
    amends: harvest.openapi.note
  - finding: >-
      RE/MAX has a live Model Context Protocol endpoint. The WordPress MCP
      Adapter is installed on remax.eu: GET https://www.remax.eu/wp-json/mcp
      returns 200 with the namespace descriptor, and
      POST /wp-json/mcp/mcp-adapter-default-server with a JSON-RPC tools/list
      body returns 401 rest_forbidden — the route exists and enforces auth, so
      the tool surface could not be enumerated and no tools were recorded. Two
      further gated agent surfaces are present: /wp-json/wp-abilities/v1/abilities
      (401) and /wp-json/jet-engine/v1/mcp-tools (401, "You cannot view the
      feature list"). This is unmanaged agent exposure via a marketing CMS, not
      an API-programme decision. Captured in mcp/re-max-mcp.yml.
    amends: apiFamily (which recorded no MCP surface)
  - finding: >-
      RE/MAX Europe publishes an llms.txt. https://www.remax.eu/llms.txt returns
      200 (39,691 bytes, generated by Rank Math SEO) — a marketing-site index of
      pages, posts, events and people, with no developer content. Saved verbatim
      to llms/re-max-eu-site-llms.txt. (www.remax.com/llms.txt remains 404.)
    amends: probes.usCorporateAndPortalSearch
  - finding: >-
      The Datahub error contract was captured live. Anonymous calls to
      https://api.datahub.remax.eu/external/* return HTTP 400 with
      {"status":[{"code":4007,"message":"Login parameter Required"}],"result":{}}
      and an invalid token returns HTTP 403 with code 4004 "Invalid or expired
      Session/Token". The auth gate answers ahead of routing, so unauthenticated
      callers cannot enumerate routes. Envelope is proprietary, not RFC 9457.
      Captured in errors/re-max-error-codes.yml.
    amends: authModel
  - finding: >-
      status.remax.com and trust.remax.com both answer 403 behind Cloudflare and
      both resolve to CNAME customers.kvcore.com — identical to the control probe
      zzzznotreal.remax.com. Neither is a status page or a trust center; both are
      wildcard artifacts. Recorded as ABSENT so no scoring pointer is emitted.
    amends: apiFamily.status page
  - finding: >-
      No first-party SDK exists in any registry (npm, PyPI, Maven, NuGet,
      RubyGems, Packagist, crates.io) and there is no RE/MAX GitHub organisation.
      Registry searches for "remax" surface an unrelated React mini-program
      framework (@remax/*, remaxjs) that must never be catalogued as a RE/MAX
      SDK. Recorded as a verified negative in packages/re-max-packages.yml.
    amends: apiFamily.sdks
  - finding: >-
      The staging Listings origin (listing-api-remaxeu.bwscloud.tech) now returns
      an nginx 403 to every anonymous path, including the convenience reads that
      previously looked unauthenticated (/api/v1/listings/countries). The staging
      environment is fully closed to anonymous callers as of this probe.
    amends: probes.euDeveloperSurface
  - finding: >-
      Transport hardening is inverted. The two Postman documentation hosts, which
      carry no data, are TLS 1.3 with HSTS preload; the production API host and
      the OAuth authorization server negotiate TLS 1.2 with no HSTS while passing
      bearer tokens in query strings. Neither remax.com nor remax.eu publishes CAA
      records or DNSSEC, and DMARC is p=quarantine on both.
    amends: security posture
  artifacts_added:
  - authentication/re-max-authentication.yml
  - conventions/re-max-conventions.yml
  - errors/re-max-error-codes.yml
  - lifecycle/re-max-lifecycle.yml
  - conformance/re-max-conformance.yml
  - data-model/re-max-data-model.yml
  - sandbox/re-max-sandbox.yml
  - packages/re-max-packages.yml
  - mcp/re-max-mcp.yml
  - well-known/re-max-well-known.yml
  - well-known/re-max-eu-wp-json.json
  - llms/re-max-llms.txt
  - llms/re-max-eu-site-llms.txt
  - skills/_index.yml
  - skills/re-max-datahub-agent-lifecycle.md
  - skills/re-max-publish-listing.md
  not_emitted:
    openapi: no spec exists; none was generated, because generating one would misrepresent RE/MAX's posture
    overlays: nothing to overlay
    asyncapi_webhooks: no event or webhook surface exists anywhere in the estate
    scopes: OAuth 2.0 is used but no scope vocabulary is published; an empty scopes file would be noise
    changelog_cli_components: none published
    grpc: none published
    tool_crosswalk: requires both an OpenAPI and an enumerable MCP tool list; neither is available
    decline_codes: not a payments provider
    status_page_deprecation_compliance_security_sdk_idempotency_pointers: >-
      deliberately NOT wired — RE/MAX publishes no status page, no deprecation
      policy, no compliance programme, no vulnerability disclosure programme, no
