note: >-
  RE/MAX has no single authentication model because it has no single API
  program. The two documented RE/MAX Europe APIs both use OAuth 2.0
  authorization code against RE/MAX Europe operated authorization servers, and
  both carry the resulting token as an access_token QUERY PARAMETER rather than
  an Authorization header. No OpenID Connect discovery document and no RFC 8414
  authorization-server metadata is served by either authorization server. No
  scope vocabulary is published; the Postman documentation ships the literal
  placeholder "<scope>". Credentials are not self-serve: the Datahub collection
  carries the client_id placeholder "Ask_REU" (ask RE/MAX Europe). Separately,
  the remax.eu WordPress estate answers anonymously for public read routes and
  returns 401 rest_forbidden for everything privileged, including its MCP and
  Abilities routes.
