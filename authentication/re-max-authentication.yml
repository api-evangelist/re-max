security_observations:
- >-
  Bearer material in the query string. Both RE/MAX Europe APIs pass the OAuth
  access token as a URL query parameter, so tokens land in server logs, proxy
  logs, referrer headers and browser history. An Authorization header is the
  RFC 6750 recommended transport.
- >-
  No authorization-server metadata. Neither OIDC discovery nor RFC 8414 metadata
  is served, so a client cannot machine-discover endpoints, supported grants,
  PKCE support or signing keys.
- >-
  No published scopes. Without a scope vocabulary, every issued credential is
  effectively coarse-grained from a consumer's point of view.
- >-
  The published staging Listings collection embedded a live-looking 128-character
  hexadecimal access_token in four request URLs; those values were redacted
  before this repo saved the file (see review.yml harvest.collections).
