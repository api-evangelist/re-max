- aid: re-max:re-max-eu-site-api
  name: RE/MAX Europe Site API (WordPress REST)
  description: >-
    The RE/MAX Europe marketing site at remax.eu runs WordPress and exposes the
    WordPress REST API anonymously at /wp-json/. The route descriptor published
    there is the only self-describing, machine-readable, publicly callable
    contract found anywhere in the RE/MAX estate: 42 namespaces and 791 routes,
    each with its methods and argument definitions. Public content reads
    (posts, pages, media, search, events, regions, newsroom and people custom
    post types) return 200 to an anonymous caller; everything privileged returns
    401 rest_forbidden, including the WordPress Abilities registry and the two
    MCP tool surfaces installed on the site. This is a content-management
    platform default rather than a RE/MAX API product, and it is catalogued as
    such — but it is real, it is reachable, and it is where RE/MAX's only Model
    Context Protocol endpoint lives.
  humanURL: https://www.remax.eu/wp-json/
  baseURL: https://www.remax.eu/wp-json/wp/v2
  tags:
  - Content
  - WordPress
  - MCP
  - Europe
  - Marketing
