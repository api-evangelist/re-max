apis:
- aid: re-max:re-max-eu-datahub-api
  name: RE/MAX Europe Datahub API
  description: >-
    The RE/MAX Europe Datahub API is the franchise-operations API behind the
    RE/MAX EU Datahub application. It exposes offices, persons, RE/MAX Titles
    (the agent/broker role records), teams, regions and monthly GCI /
    transaction / volume reporting to RE/MAX regional master franchisees and
    their vendors. It is a proprietary REST contract — it carries no RESO Data
    Dictionary fields, no OData surface and no Universal Property Identifier.
    Authentication is OAuth 2.0 against https://oauth.datahub.remax.eu, with the
    resulting token passed as an access_token query parameter; the published
    Postman documentation carries the client_id placeholder "Ask_REU",
    confirming credentials are handed out by RE/MAX Europe rather than
    self-served. Documentation is public; access is not.
  humanURL: https://apidocs.datahub.remax.eu/
  baseURL: https://api.datahub.remax.eu/external
  tags:
  - Franchising
  - Offices
  - Agents
  - Teams
  - Reporting
  - Europe
  properties:
  - type: Documentation
    url: https://apidocs.datahub.remax.eu/
  - type: PostmanCollection
    url: collections/re-max-eu-datahub-api.postman_collection.json
  - type: Authentication
    url: https://oauth.datahub.remax.eu/authorize
- aid: re-max:re-max-eu-listings-api
  name: RE/MAX Europe Listings API
  description: >-
    The RE/MAX Europe Listings API is used in conjunction with the RE/MAX EU
    Datahub application to add, update, retrieve and delete property listing
    data and listing images across RE/MAX European regions. It exposes listings,
    listing images, listing entry logs, regions, offices and agents, plus
    unauthenticated-looking convenience reads for listing countries and cities
    by country. Writes go through a queue with deferred validation. Like the
    Datahub API it is a proprietary REST schema with no RESO Data Dictionary
    alignment, no OData $metadata and no UPI. Authentication is OAuth 2.0 with
    the token supplied as an access_token query parameter. The only public
    documentation RE/MAX Europe publishes is for the STAGING environment, whose
    endpoints run on a third-party host (bwscloud.tech); no production base URL
    is published.
  humanURL: https://listingsapi-test.datahub.remax.eu/
  baseURL: https://listing-api-remaxeu.bwscloud.tech/api/v1
  tags:
  - Property Listings
  - Images
  - Regions
  - Agents
  - Europe
  - Staging
  properties:
  - type: Documentation
    url: https://listingsapi-test.datahub.remax.eu/
  - type: PostmanCollection
    url: collections/re-max-eu-listings-api.postman_collection.json
