name: RE/MAX
kind: company
description: >-
  RE/MAX Holdings, Inc. (NYSE: RMAX, SIC 6531, Denver, Colorado) is one of the
  world's largest real estate brokerage franchisors, licensing the RE/MAX brand
  to independently owned and operated brokerages across more than 110 countries
  and territories, and franchising mortgage brokerages in the United States
  under the Motto Mortgage brand with loan processing through wemlo. Its home
  market is the United States, where it sits in the value chain as a franchisor
  and consumer portal operator rather than as a data owner: the listing content
  behind remax.com is licensed from roughly 500 local Multiple Listing Services
  under IDX and syndication agreements, so RE/MAX is a consumer of MLS data, not
  a publisher of it. Its API posture reflects that position honestly. RE/MAX is
  a RESO Class D member (Brokers, Agents and Appraisers) and holds a seat on the
  RESO Board of Directors, but it does not appear in the RESO certification
  directory of certified data providers and publishes no RESO Web API, no OData
  $metadata document and no Universal Property Identifier surface. In the United
  States there is no developer portal, no published API program and no
  machine-readable contract of any kind; developer.remax.com, developers.remax.com
  and docs.remax.com are only wildcard DNS entries pointing at the kvCORE agent
  website platform, and api.remax.com is a dangling CNAME to a decommissioned
  booj host that no longer resolves. The only real, publicly documented RE/MAX
  API surface belongs to RE/MAX Europe, whose Datahub franchise-operations API
  and Listings API are published as public Postman documentation with OAuth 2.0
  authentication, but whose credentials are issued only to RE/MAX regional master
  franchisees, offices and their vendors — documented, but not self-serve. The
  only anonymously callable, self-describing RE/MAX endpoint family found
  anywhere in the estate is the WordPress REST API on the RE/MAX Europe
  marketing site (remax.eu/wp-json, 42 namespaces and 791 routes), which also
  exposes an auth-gated Model Context Protocol endpoint via the WordPress MCP
  Adapter — a CMS surface rather than an API product, but the closest thing to
  agent-accessible RE/MAX infrastructure that exists today.
