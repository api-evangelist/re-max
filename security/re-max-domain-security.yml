observations:
- >-
  No CAA records on either registrable domain, so any public CA may issue for
  remax.com or remax.eu.
- >-
  No DNSSEC on either domain.
- >-
  DMARC is enforced only at p=quarantine, not p=reject, on both domains.
- >-
  remax.com serves a DNS wildcard (CNAME customers.kvcore.com). The control probe
  zzzznotreal.remax.com resolves identically to developer.remax.com,
  developers.remax.com, docs.remax.com, status.remax.com and trust.remax.com -
  none of those hostnames is a service RE/MAX runs. A wildcard that answers on
  443 for every conceivable subdomain is itself a security-relevant posture
  (subdomain-confusion and phishing surface).
- >-
  api.remax.com is a dangling CNAME to api.remax-prod.booj.io, which returns
  NXDOMAIN - a classic subdomain-takeover shape left behind by the decommissioned
  booj platform.
- >-
  The API and OAuth hosts negotiate TLS 1.2 and set no HSTS, while the two
  Postman documentation hosts (which carry no data) are TLS 1.3 with HSTS
  preload. The transport hardening is inverted relative to where the risk is.
programs:
  security_txt: absent on every host probed
  vulnerability_disclosure: none published
  trust_center: >-
    none. trust.remax.com answers 403 only because of the remax.com wildcard; it
    is not a trust center.
