- from: Listing
  to: ListingImage
  type: has_many
  via: listingId
- from: Listing
  to: Agent
  type: belongs_to
  via: agentUniqueId
- from: Listing
  to: Office
  type: belongs_to
  via: officeId
- from: Listing
  to: Region
  type: belongs_to
  via: regionId
- from: Listing
  to: ListingEntryLog
  type: has_many
  via: listingId
cross_api_bridge:
  description: >-
    The Listings API is a downstream projection of Datahub identity. Its
    getByRemaxId operations for offices and agents take Datahub composite keys
    (AT1-F100199, ch1-p12345), which is the seam between the two APIs.
  operations:
  - GET /api/v1/offices/getByRemaxId/:remaxId
  - GET /api/v1/agents/getByRemaxId/:remaxId
  - GET /api/v1/regions/getByRemaxId/:remaxId
absent_domains:
  note: >-
    RE/MAX publishes no API in these adjacent real-estate domains anywhere in the
    estate
  domains:
  - property records
  - valuation / AVM
  - title and escrow
  - transaction management
  - documents and e-signature
  - tenancy and rentals
  - payments
  - consumer portal search (remax.com is WAF-protected and robots-disallowed on /api/)
