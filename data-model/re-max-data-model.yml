  - datePublished
  - commissionRateBuyer
  - commissionRateSeller
  - contractType
  - buyerDemographic
  - sellerDemographic
  - listingUrl
  - listingImages
  field_source: request body of "Add Listing" in the staging Listings collection
  note: >-
