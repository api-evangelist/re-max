generated: '2026-07-26'
method: derived
source:
- collections/re-max-eu-datahub-api.postman_collection.json
- collections/re-max-eu-listings-api.postman_collection.json
note: >-
  Derived from the request paths, path parameters, query parameters and request
  bodies of the two published RE/MAX Europe Postman collections. There is no
  OpenAPI to read $refs from, so relationships are inferred from identifier
  fields and path nesting that appear verbatim in the collections. Field lists
  are only recorded where a real request body publishes them.
identity_scheme:
  description: region-prefixed composite keys; identity is scoped to a RE/MAX region
  patterns:
    region: two or three character code (FI1, GR1, CH1, CH2, AT1, GB1, TR1)
    person: <region>-P<number> (FI1-P102962, CH2-P100002)
    office: <region>-F<number> (AT1-F100199, FI1-F1079993)
    team: <region>-T<number> (FI1-T100001, GR1-T102170)
    listing: partner-supplied listingId, unique only within a region
entities:
- name: Region
  api: datahub
  operations:
  - GET /external/regions/
  - GET /external/region/:regionID/subregions/
  - GET /external/region/:regionID/titles/
  note: top of the RE/MAX Europe franchise hierarchy; a master franchise territory
- name: Subregion
  api: datahub
  operations:
  - GET /external/region/:regionID/subregions/
- name: Office
  api: datahub
  operations:
  - GET /external/offices/
  - GET /external/office/:officeID
  - PUT /external/office/:officeID
  - GET /external/office/:officeID/franchiseAgreement/
  note: a franchised RE/MAX brokerage office
- name: FranchiseAgreement
  api: datahub
  operations:
  - GET /external/office/:officeID/franchiseAgreement/
  note: the franchise contract data behind an office
- name: Person
  api: datahub
  operations:
  - GET /external/persons/
  - POST /external/persons/
  - GET /external/person/:personID
  - PUT /external/person/:personID
  - GET /external/personBySSN/:SSNnumber
  - POST /external/person/:personID/terminate/
  note: >-
    a natural person in the network; reachable by national social security number,
    which is the highest-sensitivity surface in the estate
- name: Title
  api: datahub
  operations:
  - GET /external/person/:personID/history/
  - POST /external/person/:personID/title/
  - PUT /external/person/:personID/changeCurrentPrimaryTitle/
  - GET /external/title/:titleID/
  - PUT /external/title/:titleID/transfer/
  - PUT /external/title/:titleID/exchange/
  - PUT /external/title/:titleID/end/
  note: >-
    a RE/MAX Title is the role record binding a Person to an Office for a period;
    it is the core temporal entity of the Datahub model
- name: Team
  api: datahub
  operations:
  - GET /external/teams/
  - POST /external/teams
  - GET /external/teams/:teamID
  - PUT /external/teams/:teamID
  - POST /external/teams/:teamID/change-leader
  - POST /external/teams/:teamID/dissolve
- name: TeamMembership
  api: datahub
  operations:
  - GET /external/teams/:teamID/members
  - POST /external/teams/:teamID/members
  - PUT /external/teams/:teamID/members/:memberID
  - GET /external/person/:personID/memberships
- name: ReportingPeriod
  api: datahub
  operations:
  - GET /external/reporting/:regionID/:reportingPeriod/
  - GET /external/reporting/:regionID/:reportingPeriod/:officeID/
  - POST /external/reporting/:regionID/:reportingPeriod/
  note: monthly GCI, transaction count and volume per office and per person
- name: Listing
  api: listings
  operations:
  - GET /api/v1/listings
  - GET /api/v1/listings/random
  - POST /api/v1/listings
  - PUT /api/v1/listings/:id
  - DELETE /api/v1/listings/:id
  - GET /api/v1/listings/getByRegionIdAndListingId
  - PUT /api/v1/listings/updateByRegionIdAndListingId
  - DELETE /api/v1/listings/deleteByRegionIdAndListingId
  fields:
