- name: ListingImage
  api: listings
  operations:
  - POST /api/v1/listings/:listing_id/images
  - POST /api/v1/listings/addImagesByListingIdAndRegionId
  - PUT /api/v1/listings/replaceImageByListingIdAndRegionId/:image_id
  - PUT /api/v1/listings/:listing_id/images/:image_id/description
  - PUT /api/v1/listings/updateImageDescriptionByListingIdAndRegionId/:image_id
  - DELETE /api/v1/listings/:listing_id/images/:image_id
  - DELETE /api/v1/listings/deleteImageByListingIdAndRegionId/:image_id
  fields:
