  - GET /api/v1/listinglogs/:id
  - GET /api/v1/listinglogs/failed
  - GET /api/v1/listinglogs/listingId/:listingId
  - GET /api/v1/listinglogs/regionId/:regionId
  note: >-
    the deferred-validation audit trail; the only place a partner learns that a
    queued write failed
- name: Agent
  api: listings
  operations:
  - GET /api/v1/agents
  - GET /api/v1/agents/:id
  - GET /api/v1/agents/getByRemaxId/:remaxId
  note: the Listings API projection of a Datahub Person
- name: ListingCountry
  api: listings
  operations:
  - GET /api/v1/listings/countries
  - GET /api/v1/listings/citiesbycountry?country=
relationships:
- from: Region
  to: Subregion
  type: has_many
  via: regionID
- from: Region
  to: Office
  type: has_many
  via: regionId prefix on the office identifier
- from: Region
  to: Title
  type: has_many
